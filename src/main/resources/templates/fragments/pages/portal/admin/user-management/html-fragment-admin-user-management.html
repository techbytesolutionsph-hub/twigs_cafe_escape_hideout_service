<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <div th:fragment="staff-admin-user-management(users)">
        <!-- User Management - START -->
        <section class="default-card css-default-card">
            <div class="css-default-card-header mb-2">
                <div class="section-title">
                    <div class="section-title-icon">
                        <i class="fas fa-users mr-2"></i>
                    </div>
                    <div>
                        <h2>User Records</h2>
                        <p>View, manage, and review user accounts and access information.</p>
                    </div>
                </div>

                <a th:href="@{/app/portal/admin/user-management/add-user-account}"
                   class="btn-glossy-teal-header d-flex justify-content-center align-items-center"
                   id="add-user-btn" style="text-decoration: none">

                    <i class="fa-solid fa-user-plus mr-2"></i> Add User
                </a>
            </div>
            <div class="reports-table-wrapper">
                <div class="table-responsive">
                    <table class="table table-bordered" id="userTable">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td data-label="ID" th:text="${user.id}">1</td>
                            <td data-label="Username" th:text="${user.username}"></td>
                            <td data-label="Email" th:text="${user.email}">1</td>
                            <td data-label="Status">
                                    <span class="status-badge badge-active"
                                          th:if="${user.status.name() == 'ACTIVE'}">
                                        <i class="bi bi-check-circle-fill mr-1"></i> Active
                                    </span>

                                <span class="status-badge badge-inactive"
                                      th:if="${user.status.name() == 'INACTIVE'}">
                                        <i class="bi bi-pause-circle-fill mr-1"></i> Inactive
                                    </span>

                                <span class="status-badge badge-suspended"
                                      th:if="${user.status.name() == 'SUSPENDED'}">
                                        <i class="bi bi-exclamation-triangle-fill mr-1"></i> Suspended
                                    </span>

                                <span class="status-badge badge-disabled"
                                      th:if="${user.status.name() == 'DISABLED'}">
                                        <i class="bi bi-person-x-fill mr-1"></i> Disabled
                                    </span>
                            </td>
                            <td data-label="Actions" >
                                <div class="actions-buttons d-flex flex-wrap justify-content-start gap-1">
                                    <button type="button"
                                            class="btn-glossy-teal action-btn d-flex align-items-center view-user-btn"
                                            data-bs-toggle="modal"
                                            data-bs-target="#viewUserModal"
                                            th:data-username="${user.username}">
                                        <i class="bi bi-eye mr-1"></i> View
                                    </button>
                                    <a th:href="@{|/app/portal/admin/user-management/edit-user-account?id=${user.username}|}"
                                       class="btn-glossy-teal action-btn d-flex align-items-center">
                                        <i class="bi bi-pen mr-1"></i> Edit
                                    </a>
                                    <button type="button"
                                            class="btn-glossy-teal delete-user-btn action-btn d-flex align-items-center"
                                            th:data-username="${user.username}">
                                        <i class="bi bi-person-x mr-1"></i> Disable
                                    </button>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <div class="modal fade" id="viewUserModal" tabindex="-1"
             aria-labelledby="viewUserModalLabel" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-md">
                <div class="modal-content user-view-modal">
                    <div class="modal-header">
                        <div>
                            <h5 class="modal-title" id="viewUserModalLabel">
                                <i class="fa-solid fa-user-circle me-2"></i>
                                User Account Details
                            </h5>
                            <p class="mb-0 mt-1 modal-subtitle">
                                View user account information and access details.
                            </p>
                        </div>

                        <button type="button" class="btn-close"
                                data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <!-- Body -->
                    <div class="modal-body">

                        <div class="user-profile-section">
                            <div class="user-avatar">
                                <img id="viewUserPhoto" src="/images/default-profile.png" alt="User Photo">
                            </div>
                        </div>

                        <div class="user-details-section">
                            <h6 class="section-heading">
                                <i class="fa-solid fa-id-card me-2"></i>
                                Account Information
                            </h6>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="detail-label">Username</label>
                                    <div class="detail-value">
                                        <i class="fa-solid fa-user"></i>
                                        <span id="viewUsername">-</span>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="detail-label">Password</label>
                                    <div class="detail-value">
                                        <i class="fa-solid fa-lock"></i>
                                        <span>••••••••</span>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="detail-label">Email Address</label>
                                    <div class="detail-value">
                                        <i class="fa-solid fa-envelope"></i>
                                        <span id="viewUserEmail">-</span>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="detail-label">User Role</label>
                                    <div class="detail-value">
                                        <i class="fa-solid fa-shield-halved"></i>
                                        <span id="viewUserRoleDetails">-</span>
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <label class="detail-label">Account Status</label>
                                    <div class="detail-value">
                                                <span id="viewUserStatus" class="status-badge">
                                                    -
                                                </span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Footer -->
                    <div class="modal-footer">
                        <button type="button" class="btn btn-modal-close"
                                data-bs-dismiss="modal">
                            <i class="fa-solid fa-xmark me-1"></i>
                            Close
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <!-- User Management - END -->
    </div>
</html>
