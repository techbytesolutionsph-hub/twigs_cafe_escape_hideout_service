<!DOCTYPE html>
<html lang="en">
    <head>
        <th:block th:insert="~{fragments/common/html-fragment-default-meta :: meta}"></th:block>
        <title th:text="${title}">Sample Page | The Twigs</title>
        <th:block th:insert="~{fragments/common/html-fragment-common-css-links :: commoncss}"></th:block>
        <link rel="stylesheet" th:href="@{/css/common/tteh-common-css-styles.css}"/>
        <link th:href="@{/css/components/tteh-default-add-view-edit-module.css}" rel="stylesheet" type="text/css">
        <link th:href="@{/css/pages/portal/hr-admin/recruitment/candidate/add/tteh-add-candidate-module.css}" rel="stylesheet" type="text/css">
    </head>
    <body>
        <div class="app">
            <!-- Sidebar - START -->
            <th:block th:insert="~{fragments/common/html-fragment-common-sidebar :: tteh-common-sidebar(${nav})}"></th:block>
            <!-- Sidebar - END -->

            <div class="mobile-overlay" id="overlay"></div>

            <main class="main">
                <!-- Navigation Bar - START -->
                <th:block th:insert="~{fragments/common/html-fragment-common-navigation-bar :: tteh-common-navigation-bar}"></th:block>
                <!-- Navigation Bar - END -->

                <!-- Page Heading and Breadcrumbs - Start -->
                <th:block th:insert="~{fragments/common/html-fragment-common-breadcrumbs-no-greetings :: staff-breadcrumb-section(${pageTitle}, ${pageSubTitle}, ${breadcrumbs})}"></th:block>
                <!-- Page Heading and Breadcrumbs - End -->

                <!-- Main Content - START -->
                <th:block th:insert="~{fragments/pages/portal/hr-admin/recruitment/candidate/add/html-fragment-add-candidate :: staff-add-candidate}"></th:block>
                <!-- Main Content - END -->

                <!-- Footer - START -->
                <th:block th:insert="~{fragments/common/html-fragment-common-footer :: tteh-common-footer}"></th:block>
                <!-- Footer - END -->
            </main>
        </div>

        <th:block th:insert="~{fragments/common/html-fragment-common-js-scripts :: login-common-js}"></th:block>
        <script th:src="@{/js/pages/portal/hr-admin/recruitment/candidate/add/tteh-add-candidate-scripts.js}" type="text/javascript"></script>
    </body>
</html>
