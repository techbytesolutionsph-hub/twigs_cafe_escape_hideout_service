<!DOCTYPE html>
<html lang="en">
    <head>
        <th:block th:insert="~{fragments/common/html-fragment-default-meta :: meta}"></th:block>
        <title th:text="${title}">Sample Page | The Twigs</title>
        <th:block th:insert="~{fragments/common/html-fragment-common-css-links :: commoncss}"></th:block>
        <link rel="stylesheet" th:href="@{/css/common/tteh-common-css-styles.css}"/>
    </head>
    <body>
        <div class="app">
            <!-- Sidebar - START -->
            <th:block th:insert="~{fragments/common/html-fragment-common-sidebar :: tteh-common-sidebar(${nav})}"></th:block>
            <!-- Sidebar - END -->

            <div class="mobile-overlay" id="overlay"></div>

            <main class="main">
                <!-- Navigation Bar - START -->
                <th:block th:insert="~{fragments/common/html-fragment-common-navigation-bar :: tteh-common-navigation-bar}"></th:block>
                <!-- Navigation Bar - END -->

                <!-- Page Heading and Breadcrumbs - Start -->
                <th:block th:insert="~{fragments/common/html-fragment-staff-breadcrumbs :: staff-breadcrumb-section(${pageTitle}, ${breadcrumbs})}"></th:block>
                <!-- Page Heading and Breadcrumbs - End -->

                <!-- Main Content - START -->
                <section class="default-card css-default-card">
                    <div class="css-default-card-header mb-2">
                        <div class="section-title">
                            <div class="section-title-icon">
                                <i class="fas fa-users mr-2"></i>
                            </div>
                            <div>
                                <h2>User Records</h2>
                                <p>View, manage, and review user accounts and access information.</p>
                            </div>
                        </div>

                        <a th:href="@{/app/portal/admin/user-management/add-user-account}"
                           class="btn-glossy-teal-header d-flex justify-content-center align-items-center"
                           id="add-user-btn" style="text-decoration: none">

                            <i class="fa-solid fa-user-plus mr-2"></i> Add User
                        </a>
                    </div>
                    <div class="reports-table-wrapper">
                        <div class="table-responsive">
                            <table class="table table-bordered" id="userTable">
                                <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Username</th>
                                    <th>Email</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="user : ${users}">
                                    <td data-label="ID" th:text="${user.id}">1</td>
                                    <td data-label="Username" th:text="${user.username}"></td>
                                    <td data-label="Email" th:text="${user.email}">1</td>
                                    <td data-label="Status">
                                    <span class="status-badge badge-active"
                                          th:if="${user.status.name() == 'ACTIVE'}">
                                        <i class="bi bi-check-circle-fill mr-1"></i> Active
                                    </span>

                                        <span class="status-badge badge-inactive"
                                              th:if="${user.status.name() == 'INACTIVE'}">
                                        <i class="bi bi-pause-circle-fill mr-1"></i> Inactive
                                    </span>

                                        <span class="status-badge badge-suspended"
                                              th:if="${user.status.name() == 'SUSPENDED'}">
                                        <i class="bi bi-exclamation-triangle-fill mr-1"></i> Suspended
                                    </span>

                                        <span class="status-badge badge-disabled"
                                              th:if="${user.status.name() == 'DISABLED'}">
                                        <i class="bi bi-person-x-fill mr-1"></i> Disabled
                                    </span>
                                    </td>
                                    <td data-label="Actions" >
                                        <div class="actions-buttons d-flex flex-wrap justify-content-start gap-1">
                                            <a th:href="@{|/app/portal/admin/user-management/view-user-account?id=${user.username}|}"
                                               class="btn-glossy-teal action-btn d-flex align-items-center">
                                                <i class="bi bi-eye mr-1"></i> View
                                            </a>
                                            <a th:href="@{|/app/portal/admin/user-management/edit-user-account?id=${user.username}|}"
                                               class="btn-glossy-teal action-btn d-flex align-items-center">
                                                <i class="bi bi-pen mr-1"></i> Edit
                                            </a>
                                            <button type="button"
                                                    class="btn-glossy-teal delete-user-btn action-btn d-flex align-items-center"
                                                    th:data-id="${user.username}">
                                                <i class="bi bi-person-x mr-1"></i> Disable
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </section>
                <!-- Main Content - END -->

                <!-- Footer - START -->
                <th:block th:insert="~{fragments/common/html-fragment-common-footer :: tteh-common-footer}"></th:block>
                <!-- Footer - END -->
            </main>

        </div>

        <th:block th:insert="~{fragments/common/html-fragment-common-js-scripts :: login-common-js}"></th:block>
        <script th:src="@{/js/pages/portal/dashboard/tteh-dashboard-main-scripts.js}" type="text/javascript"></script>
    </body>
</html>
