<!DOCTYPE html>
<html lang="en">
    <head>
        <th:block th:insert="~{fragments/common/html-fragment-default-meta :: meta}"></th:block>
        <title th:text="${title}">Sample Page | The Twigs</title>
        <link rel="stylesheet" th:href="@{/css/pages/error/tteh-common-error-styles.css}"/>
    </head>
    <body>
        <div class="container">
            <div class="message">
                <h1 id="error-code" th:text="${errorCode}">403</h1>
                <h4 id="error-message" th:text="${errorMessage}">Access Forbidden</h4>
                <p id="error-description" th:text="${errorDescription}">
                    Sorry, you do not have permission to access this requested page.
                </p>
                <a class="btn btn-sm btn-primary mt-2" id="back-to-home-btn">Back to home</a>
            </div>

            <!-- Dark Green Coffee Cup -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 440" width="520" height="440">
                <defs>
                    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0%" stop-color="#294638"/>
                        <stop offset="100%" stop-color="#0B241A"/>
                    </linearGradient>
                    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0%" stop-color="#8FAF9A"/>
                        <stop offset="100%" stop-color="#294638"/>
                    </linearGradient>
                    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
                        <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#0B241A" flood-opacity=".2"/>
                    </filter>
                </defs>

                <!-- Decorative sparkles -->
                <g fill="#8FAF9A">
                    <path d="M95 112 Q101 132 121 138 Q101 144 95 164 Q89 144 69 138 Q89 132 95 112Z"/>
                    <path d="M410 90 Q415 105 430 110 Q415 115 410 130 Q405 115 390 110 Q405 105 410 90Z"/>
                    <circle cx="105" cy="220" r="5"/>
                    <circle cx="422" cy="215" r="6"/>
                    <circle cx="380" cy="65" r="4"/>
                </g>

                <!-- Coffee splash -->
                <path d="M165 310 Q130 285 145 265 Q155 250 171 267 Q176 235 193 250 Q208 265 199 285 Q245 260 260 286 Q278 310 245 320Z" fill="#6F8B75"/>

                <!-- Steam -->
                <g fill="none" stroke="#8FAF9A" stroke-width="6" stroke-linecap="round">
                    <path d="M205 95 Q180 65 205 43">
                        <animate attributeName="d" dur="2.8s" repeatCount="indefinite"
                                 values="M205 95 Q180 65 205 43;M205 95 Q225 65 205 43;M205 95 Q180 65 205 43"/>
                    </path>
                    <path d="M260 85 Q235 55 260 28">
                        <animate attributeName="d" dur="3.2s" repeatCount="indefinite"
                                 values="M260 85 Q235 55 260 28;M260 85 Q280 55 260 28;M260 85 Q235 55 260 28"/>
                    </path>
                    <path d="M315 95 Q290 65 315 43">
                        <animate attributeName="d" dur="3s" repeatCount="indefinite"
                                 values="M315 95 Q290 65 315 43;M315 95 Q335 65 315 43;M315 95 Q290 65 315 43"/>
                    </path>
                </g>

                <!-- Arms -->
                <g fill="none" stroke="#102F22" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M165 205 Q125 190 112 150 Q105 130 91 125"/>
                    <path d="M355 205 Q395 190 408 150 Q415 130 429 125"/>
                </g>

                <!-- Hands -->
                <g fill="#8FAF9A" stroke="#102F22" stroke-width="5">
                    <circle cx="88" cy="120" r="13"/>
                    <circle cx="432" cy="120" r="13"/>
                    <path d="M78 111 Q65 94 76 87 Q87 82 91 100 Q94 83 105 88 Q116 97 99 113Z"/>
                    <path d="M421 111 Q408 94 419 87 Q430 82 434 100 Q437 83 448 88 Q459 97 442 113Z"/>
                </g>

                <!-- Cup handle -->
                <path d="M355 170
                   C425 145 440 245 380 270
                   L352 270"
                      fill="none" stroke="#102F22" stroke-width="24" stroke-linecap="round"/>
                <path d="M358 177
                   C410 163 420 235 377 251"
                      fill="none" stroke="#6F8B75" stroke-width="10" stroke-linecap="round"/>

                <!-- Main cup -->
                <g filter="url(#shadow)">
                    <path d="M155 140 Q260 115 365 140 L345 300 Q338 345 260 350 Q182 345 175 300Z" fill="url(#cup)" stroke="#0B241A" stroke-width="7"/>

                    <!-- Cup rim -->
                    <ellipse cx="260" cy="142" rx="105" ry="22"
                             fill="#8FAF9A" stroke="#102F22" stroke-width="7"/>
                    <ellipse cx="260" cy="143" rx="87" ry="13" fill="url(#coffee)"/>

                    <!-- Cup shine -->
                    <path d="M185 175 Q177 235 190 275"
                          fill="none" stroke="#8FAF9A" stroke-width="8"
                          stroke-linecap="round" opacity=".65"/>

                    <!-- Face -->
                    <g fill="#F3EEE5">
                        <ellipse cx="225" cy="220" rx="10" ry="14"/>
                        <ellipse cx="295" cy="220" rx="10" ry="14"/>
                    </g>
                    <g fill="#102F22">
                        <circle cx="228" cy="222" r="4"/>
                        <circle cx="298" cy="222" r="4"/>
                    </g>
                    <path d="M241 246 Q260 264 279 246"
                          fill="none" stroke="#F3EEE5" stroke-width="6"
                          stroke-linecap="round"/>
                    <g fill="#8FAF9A" opacity=".9">
                        <ellipse cx="205" cy="246" rx="12" ry="7"/>
                        <ellipse cx="315" cy="246" rx="12" ry="7"/>
                    </g>
                </g>

                <!-- Legs -->
                <g fill="none" stroke="#102F22" stroke-width="15" stroke-linecap="round">
                    <path d="M220 345 L205 375"/>
                    <path d="M300 345 L315 375"/>
                </g>
                <g fill="#8FAF9A" stroke="#102F22" stroke-width="5">
                    <ellipse cx="194" cy="382" rx="23" ry="12"/>
                    <ellipse cx="326" cy="382" rx="23" ry="12"/>
                </g>
            </svg>


        </div>
    </body>

    <th:block th:insert="~{fragments/common/html-fragment-common-js-scripts :: login-common-js}"></th:block>
    <script th:src="@{/js/pages/error/tteh-common-error-scripts.js}" type="text/javascript"></script>
</html>
