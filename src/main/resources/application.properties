# =============================
# Server Configuration
# =============================
server.port=8080
server.address=0.0.0.0
spring.application.name=the-twigs-escape-hideout-service

# =============================
# Spring JPA / Hibernate
# =============================
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.jdbc.time_zone=GMT+8
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =============================
# Create Schema
# =============================
spring.datasource.db.schema=the_twigs_escape_hideout_db
spring.datasource.db.queryForObject=SELECT nextval('%s')

# =============================
# DataSource (Postgres)
# =============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/TTEH_PROD?currentSchema=the_twigs_escape_hideout_db
spring.jpa.properties.hibernate.default_schema=the_twigs_escape_hideout_db
spring.datasource.username=postgres
spring.datasource.password=password


# =============================
# HikariCP settings
# =============================
spring.datasource.hikari.pool-name=HikariPool
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.leak-detection-threshold=20000

spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.max-lifetime=600000

# =============================
# Security / Paths
# =============================
security.permit.paths.tteh.swaggerPath=/v3/api-docs/**,/swagger-ui/**,/swagger-ui.html
security.permit.paths.tteh.staticPath=/css/**,/js/**,/img/**,/fonts/**,/webjars/**,/common/**,/custom/**
security.permit.paths.tteh.internalPath=/api/v1/**
security.permit.paths.tteh.defaultPath=/app/portal/**,/client/portal/**
security.permit.paths.tteh.errorPath=/app/portal/error/**

security.permit.paths.tteh.staffPath=/app/portal/**
security.permit.paths.tteh.staffLogin=/app/portal/login
security.permit.paths.tteh.staffLogout=/app/portal/logout
security.permit.paths.tteh.staffDashboard=/app/portal/dashboard

security.permit.paths.tteh.errorPagePath=/app/portal/error/error-page

